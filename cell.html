<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell Equation</title>
<style>
  :root{--bg:#170c2b;--card:#241645;--line:#5a3fa0;--accent:#6d3fe0;--text:#eee6ff;--muted:#cbbcf0;--res:#ffd98a;--ok:#00e676;--ink:#4b2f8a;--bgtext:#130a28;}
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--bg);color:var(--text);font-family:system-ui,Tahoma,sans-serif;min-height:100vh;padding:52px 12px 16px;position:relative;overflow-x:hidden;}
  .bg-wrap{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .bg-text{position:absolute;top:50%;margin-top:-0.6em;left:0;white-space:nowrap;font-family:system-ui,sans-serif;font-weight:800;font-size:12vw;line-height:1;color:var(--bgtext);filter:blur(1.5px);animation:bgmove 18s linear infinite;}
  @keyframes bgmove{from{transform:translateX(-100%);} to{transform:translateX(100vw);}}
  .wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;}
  h1{font-size:18px;margin:6px 0 10px;color:var(--muted);text-align:center;}
  select{padding:6px 10px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;}
  .ctls{display:flex;justify-content:center;margin:8px 0;}
  .ctl{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);}
  .ctl span{padding:0 8px;font-size:14px;color:var(--muted);}
  .ctl button{background:var(--accent);color:#fff;border:0;padding:6px 12px;font-size:18px;line-height:1;}
  .ctl button:disabled{opacity:.3;}
  .ctl b{min-width:30px;text-align:center;font-size:15px;}
  .signrow{display:flex;justify-content:center;align-items:center;gap:8px;margin:8px 0;font-size:15px;color:var(--muted);}
  .err{color:var(--res);font-size:13px;min-height:1em;text-align:center;margin:6px 0;}
  table.cells{width:100%;border-collapse:collapse;direction:ltr;table-layout:fixed;}
  table.cells td{border:1px solid var(--line);padding:0;}
  table.cells td.hdr{border:0;color:var(--muted);font-size:12px;text-align:center;padding:2px 0;}
  table.cells input{width:100%;display:block;background:var(--card);color:var(--text);border:0;border-radius:0;padding:10px 0;font-size:17px;text-align:center;min-width:0;font-family:monospace;}
  .total{direction:ltr;text-align:center;font-family:monospace;font-size:16px;margin:12px 0;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);word-break:break-word;}
  .calc{direction:ltr;font-family:monospace;font-size:16px;margin-top:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .top{display:flex;justify-content:center;}
  .pair{display:flex;justify-content:center;align-items:center;gap:40px;}
  .side{display:flex;align-items:center;gap:8px;}
  .stk{text-align:right;min-width:72px;}
  .stk > div{padding:2px 0;}
  .stk .ln{border-bottom:2px solid var(--text);padding-bottom:4px;margin-bottom:4px;}
  .stk .res{color:var(--res);font-weight:bold;}
  .mid{border:2px solid var(--ok);border-radius:8px;padding:8px 12px;font-size:18px;font-weight:bold;color:var(--ok);}
  .badge{background:var(--accent);color:#fff;border-radius:6px;padding:2px 7px;font-size:14px;}
  .multrow{direction:ltr;text-align:center;margin:12px 0;color:var(--muted);}
  .multrow input{padding:8px;width:90px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;text-align:center;font-size:16px;}
  #ext{direction:ltr;text-align:center;font-family:monospace;font-size:16px;line-height:2.1;}
  .menu-wrap{position:fixed;top:8px;right:8px;z-index:20;}
  #menuBtn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:6px 12px;font-size:18px;line-height:1;}
  .menu{margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;min-width:230px;}
  .mset{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-top:1px solid var(--line);}
  .mset label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);}
  .mset select{width:100%;}
  .menu button{background:none;color:var(--text);border:0;padding:10px 12px;text-align:start;font-size:15px;font-family:inherit;}
  .menu button:hover{background:var(--line);}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:30;padding:12px;}
  .win{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:340px;position:relative;color:var(--text);}
  .win h2{font-size:18px;margin:4px 0 12px;}
  .win label{display:block;margin:8px 0;font-size:14px;}
  .win label input{display:block;width:100%;margin-top:4px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px;direction:ltr;}
  .win button[type=submit]{width:100%;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px;font-size:15px;margin-top:8px;}
  .win .close{position:absolute;top:8px;inset-inline-start:8px;background:none;color:var(--text);border:0;font-size:20px;}
  .msg{font-size:13px;margin:8px 0 0;color:var(--res);min-height:1em;}
  .msg.err{color:#ff8a80;}
  .split{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0;}
  .split > *{margin:4px 0;}
  .social{margin:64px 0 24px;display:flex;flex-direction:column;align-items:center;gap:12px;direction:ltr;}
  .social .row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;}
  .social a{display:flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;font-size:14px;}
  .social a:not([href]){opacity:.5;cursor:default;}
  .social img{width:30px;height:30px;border-radius:6px;}
  [hidden]{display:none !important;}
</style>
</head>

<div class="bg-wrap" aria-hidden="true"><span class="bg-text" id="bgName">thepilottmnl001</span></div>

<div class="menu-wrap">

          <option value="petrol">آبی نفتی / Petrol Blue / Petrol Mavisi / أزرق نفطي</option>
          <option value="burgundy">زرشکی گارنت / Garnet Burgundy / Garnet Bordo / عقيقي غارنت</option>
          <option value="navy">سرمه‌ای نیمه‌شب / Midnight Navy / Gece Lacivert / كحلي منتصف الليل</option>
          <option value="olive">زیتونی طلایی / Golden Olive / Altın Zeytin / زيتوني ذهبي</option>

          <option value="jade">یشمی / Jade / Yeşim / يشمي</option>
          <option value="cream">کرمی / Cream / Krem / كريمي</option>

      </label>
      <label><span data-i18n="langLbl"></span>

          <option value="fa">فارسی</option>

          <option value="tr">Türkçe (İstanbul)</option>
          <option value="ar">العربية</option>
        </select>
      </label>
    </div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="win">
    <button class="close" id="closeBtn" type="button" data-i18n-aria="close">×</button>
    <form id="signupForm" hidden>
      <h2 data-i18n="signup"></h2>
      <label><span data-i18n="username"></span><input name="nick" autocomplete="username"></label>
      <label><span data-i18n="email"></span><input name="email" type="email" autocomplete="email"></label>
      <label><span data-i18n="password"></span><input name="pass" type="password" autocomplete="new-password"></label>
      <label><span data-i18n="repeatPassword"></span><input name="pass2" type="password" autocomplete="new-password"></label>
      <label><span id="capQ"></span><input name="cap" inputmode="numeric"></label>
      <button type="submit" data-i18n="register"></button>
      <p class="msg" id="signupMsg"></p>
    </form>
    <form id="signinForm" hidden>
      <h2 data-i18n="signin"></h2>
      <label><span data-i18n="email"></span><input name="email" type="email" autocomplete="email"></label>
      <label><span data-i18n="password"></span><input name="pass" type="password" autocomplete="current-password"></label>
      <button type="submit" data-i18n="login"></button>
      <p class="msg" id="signinMsg"></p>
    </form>
  </div>
</div>

// ---------- محاسبه ----------
const gridEl = document.getElementById('grid');
let N = 5;
const MIN_CELLS = 2, MAX_CELLS = 12;
const sumOf = a => a.reduce((x,y)=>x+y,0);
const digitSum = n => String(Math.abs(n)).split('').reduce((a,b)=>a+Number(b),0);
// بنفش: باقیماندهٔ ۱۱ (مضرب ۱۱ = ۱۱)، قدر مطلق
const purpleLeft = n => { const a = Math.abs(n); if (a === 0) return 0; const r = a % 11; return r === 0 ? 11 : r; };

function toNum(s){
  const t = String(s||'').replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0)-0x06F0)).trim();
  const n = parseFloat(t);
  return Number.isFinite(n) ? n : NaN;
}
function readVals(){
  const sgn = document.getElementById('cellSgn');
  const neg = !!sgn && sgn.value === '-';
  return Array.from({length:N}, (_,c) => {
    const el = gridEl.querySelector('input[data-c="'+c+'"]');
    const raw = el ? el.value : '';
    const n = toNum(raw);
    const signed = Number.isNaN(n) ? NaN : (neg ? -Math.abs(n) : Math.abs(n));
    return { raw: raw, n: n, signed: signed };
  });
}
function signedExpr(arr){
  return arr.map((v,i) => i===0 ? String(v) : (v < 0 ? ' − ' : ' + ') + Math.abs(v)).join('');
}
function opSign(){ const el = document.getElementById('sgn'); return (el && el.value === '+') ? 1 : -1; }
function stk(parts, res){
  const body = parts.map((p,i)=>'<div'+(i===parts.length-1?' class="ln"':'')+'>'+p+'</div>').join('');
  return '<div class="stk">'+body+'<div class="res">'+res+'</div></div>';
}
function calcHtml(sums){
  const sorted = [...sums].sort((a,b)=>b-a);
  const total = sumOf(sorted);
  const small = Math.min(...sums.map(v => Math.abs(v)));
  const sg = total < 0 ? -1 : 1;           // اگر کل منفی باشد همه چیز منفی است
  const sd = x => sg * digitSum(x);
  const sp = x => sg * purpleLeft(x);
  const diff = total + opSign() * small;
  const dsT = sd(total), dsD = sd(diff);
  const sum2 = total + diff;
  const chain = dsT + dsD;
  const pl = sp(sum2);
  const l1 = sd(sum2), l2 = sd(l1);
  // خروجی تک‌رقمی فقط یک بار و بدون پسوند نوشته می‌شود
  const sup = '<sup class="badge" style="font-size:11px;padding:0 4px;margin-left:3px">'+sp(chain)+'</sup>';
  const lastRow = Math.abs(l1) < 10
    ? '<div class="res">'+l1+'</div>'
    : '<div class="res ln">'+l1+sup+'</div><div class="res">'+l2+'</div>';
  const left = '<div class="side"><span class="badge">'+pl+'</span><div class="stk"><div>'+total+'</div><div>'+diff+'</div><div class="ln">'+sum2+'</div>'+lastRow+'</div></div>';
  const mid = '<div class="mid">'+(sg * digitSum(small))+'</div>';
  const right = '<div class="side">'+stk([dsT, dsD, chain], sd(chain))+'</div>';
  return '<div class="top">'+mid+'</div><div class="pair">'+left+right+'</div>';
}
function extraHtml(nums, M){
  const total = sumOf(nums), small = Math.min(...nums.map(v => Math.abs(v))), diff = total + opSign() * small;
  const sg = total < 0 ? -1 : 1;
  const sum2 = total + diff;
  const pl = sg * purpleLeft(sum2);
  const chainAbs = digitSum(total) + digitSum(diff);
  // اگر خروجی ستون چپ تک‌رقمی باشد پسوند وجود ندارد
  const suffix = digitSum(sum2) < 10 ? 0 : sg * purpleLeft(chainAbs);
  const L = pl + suffix, H = L * M, dH = sg * digitSum(H);
  const C = sg * (digitSum(L) + M), W = C - dH;
  const negNum = x => x < 0 ? '(' + x + ')' : String(x);
  const wrapD = list => (sg < 0 ? '-(' : '') + list.join('+') + (sg < 0 ? ')' : '');
  const digitsH = String(Math.abs(H)).split('');
  const digitsL = String(Math.abs(L)).split('').concat([String(M)]);
  return '<div>' + L + ' × ' + M + ' = ' + H + ' &nbsp; ' + T('height') + '</div>' +
         '<div>' + wrapD(digitsH) + ' = ' + dH + '</div>' +
         '<div>' + wrapD(digitsL) + ' = ' + C + ' &nbsp; ' + T('candles') + '</div>' +
         '<div>' + C + ' − ' + negNum(dH) + ' = ' + W + ' &nbsp; ' + T('waiting') + '</div>';
}
function updateExt(nums){
  const box = document.getElementById('ext');
  const raw = document.getElementById('mult').value.trim();
  if (raw === '') { box.innerHTML = ''; return; }
  const M = Number(raw);
  if (!Number.isInteger(M) || M < 0) { box.innerHTML = '<div style="color:var(--res)">'+T('errMult')+'</div>'; return; }
  box.innerHTML = extraHtml(nums, M);
}
function update(){
  const vals = readVals();
  const nums = vals.map(v => v.signed);
  const err = document.getElementById('err');
  if (vals.some(v => Number.isNaN(v.n) || Math.floor(v.n) !== v.n)){
    err.textContent = T('errCells');
    document.getElementById('total').textContent = '';
    document.getElementById('calc').innerHTML = '';
    document.getElementById('ext').innerHTML = '';
    return;
  }
  err.textContent = '';
  const sorted = [...nums].sort((a,b)=>b-a);
  document.getElementById('total').textContent = signedExpr(sorted) + ' = ' + sumOf(sorted);
  document.getElementById('calc').innerHTML = calcHtml(nums);
  updateExt(nums);
}
function build(prev){
  let h = '<tr>';
  for (let c=0;c<N;c++) h += '<td class="hdr">'+(c+1)+'</td>';
  h += '</tr><tr>';
  for (let c=0;c<N;c++){
    const v = (prev && prev[c] != null) ? prev[c] : '';
    h += '<td><input inputmode="numeric" value="'+v+'" data-c="'+c+'"></td>';
  }
  h += '</tr>';
  gridEl.innerHTML = h;
  document.getElementById('cellN').textContent = N;
  document.getElementById('addCell').disabled = N >= MAX_CELLS;
  document.getElementById('delCell').disabled = N <= MIN_CELLS;
  update();
}
function resizeCells(dd){
  const prev = readVals().map(v => v.raw);
  N = Math.min(MAX_CELLS, Math.max(MIN_CELLS, N + dd));
  build(prev);
}
gridEl.addEventListener('input', update);
gridEl.addEventListener('change', update);
document.getElementById('mult').addEventListener('input', update);
document.getElementById('sgn').addEventListener('change', update);
document.getElementById('cellSgn').addEventListener('change', update);
document.getElementById('addCell').onclick = () => resizeCells(1);
document.getElementById('delCell').onclick = () => resizeCells(-1);
