<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>app_2 — جمع ستون‌ها</title>
<style>
  :root{--bg:#170c2b;--card:#241645;--line:#5a3fa0;--accent:#6d3fe0;--text:#eee6ff;--muted:#cbbcf0;--res:#ffd98a;--ok:#00e676;--ink:#4b2f8a;--bgtext:#130a28;--panel:#23143f;--hover:#342060;--hdr:#b9a6e6;--badge:#7c4dff}

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:10px;}
  h1{font-size:18px;margin:6px 0 8px;}
  .note{opacity:.75;font-size:13px;margin:0 0 10px;}
  .ctls{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 10px;}
  .ctl{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);}
  .ctl span{padding:0 8px;font-size:14px;color:var(--muted);}
  .ctl button{background:var(--accent);color:#fff;border:0;padding:6px 12px;font-size:18px;line-height:1;}
  .ctl button:disabled{opacity:.3;}
  .ctl b{min-width:30px;text-align:center;font-family:monospace;font-size:15px;}
  .total{direction:ltr;text-align:center;font-family:monospace;font-size:16px;margin:12px 0;padding:10px;border:1px solid var(--ink);border-radius:12px;background:var(--panel);word-break:break-word;}
  table{width:100%;border-collapse:collapse;direction:ltr;table-layout:fixed;}
  td{border:1px solid var(--ink);padding:0;}
  td.hdr{border:0;color:var(--hdr);font-family:monospace;font-size:12px;padding:2px 0;text-align:center;}
  input{width:100%;display:block;background:var(--card);color:var(--text);border:0;padding:7px 0;font-size:13px;text-align:center;font-family:monospace;min-width:0;}
  tr.sum td{background:var(--panel);}
  tr.sum span{display:block;padding:7px 0;text-align:center;font-family:monospace;font-size:12px;font-weight:bold;color:var(--res);overflow:hidden;white-space:nowrap;}

  /* نمای دو ستونی: ستون چپ و راست، عدد وسط، عددهای بنفش بیرون */
  .calc{direction:ltr;font-family:monospace;font-size:16px;margin-top:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .top{display:flex;justify-content:center;}
  .pair{display:flex;justify-content:center;align-items:center;gap:40px;}
  .side{display:flex;align-items:center;gap:8px;}
  .stk{text-align:right;min-width:72px;}
  .stk > div{padding:2px 0;}
  .stk .ln{border-bottom:2px solid var(--text);padding-bottom:4px;margin-bottom:4px;}
  .stk .res{color:var(--res);font-weight:bold;}
  .mid{border:2px solid var(--ok);border-radius:8px;padding:8px 12px;font-size:18px;font-weight:bold;color:var(--ok);}
  .badge{background:var(--badge);color:#fff;border-radius:6px;padding:2px 7px;font-size:14px;}

  [hidden]{display:none !important;}
  body{padding-top:52px;}
  .menu-wrap{position:fixed;top:8px;left:8px;z-index:20;}
  #menuBtn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:6px 12px;font-size:18px;line-height:1;}
  .menu{margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;min-width:230px;}
  .menu button{background:none;color:var(--text);border:0;padding:10px 12px;text-align:left;font-size:15px;font-family:monospace;}
  .menu button:hover{background:var(--hover);}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:30;padding:12px;}
  .win{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:340px;position:relative;}
  .win h2{font-family:monospace;font-size:18px;margin:4px 0 12px;}
  .win label{display:block;margin:8px 0;font-size:14px;}
  .win input{display:block;width:100%;margin-top:4px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px;direction:ltr;}
  .win button[type=submit]{width:100%;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px;font-size:15px;margin-top:8px;}
  .win .close{position:absolute;top:8px;left:8px;background:none;color:var(--text);border:0;font-size:20px;}
  .msg{font-size:13px;margin:8px 0 0;color:var(--res);min-height:1em;}
  .msg.err{color:#ffb4b4;}

  /* متن تار هم‌رنگ پس‌زمینه، مثل حک‌شده روی تصویر: از راست وارد می‌شود، از چپ خارج می‌شود و برمی‌گردد */
  .wrap{position:relative;z-index:1;}
  .bg-wrap{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .bg-text{position:absolute;top:50%;margin-top:-0.6em;left:0;white-space:nowrap;font-family:system-ui,sans-serif;font-weight:800;font-size:12vw;line-height:1;color:var(--bgtext);text-shadow:1px 1px 1px rgba(255,255,255,.05),-1px -1px 2px rgba(0,0,0,.55);filter:blur(1.5px);animation:bgmove 18s linear infinite alternate;}
  @keyframes bgmove{from{transform:translateX(100vw);} to{transform:translateX(-100vw);}}
  .mset{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-top:1px solid var(--line);}
  .mset label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);}
  .mset select{width:100%;padding:6px 8px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  .social{margin:64px 0 24px;display:flex;flex-direction:column;align-items:center;gap:12px;direction:ltr;}
  .social .row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;}
  .social a{display:flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;font-size:14px;}
  .social a:not([href]){opacity:.5;cursor:default;}
  .social img{width:30px;height:30px;border-radius:6px;}
</style>
</head>

<div class="bg-wrap" aria-hidden="true"><span class="bg-text" id="bgName">thepilottmnl001</span></div>

<div class="menu-wrap">
  <button id="menuBtn" aria-label="منو">☰</button>
  <div class="menu" id="menu" hidden>
    <button type="button" data-open="signin" data-i18n="signin"></button>
    <div class="mset">
      <label><span data-i18n="themeLbl"></span>
        <select id="themeSel">
          <option value="purple">بنفش / Purple / Mor</option>
          <option value="olive">زیتونی / Olive / Zeytin</option>
        </select>
      </label>
      <label><span data-i18n="langLbl"></span>
        <select id="langSel">
          <option value="fa">فارسی</option>
          <option value="en">English</option>
          <option value="tr">Türkçe (İstanbul)</option>
        </select>
      </label>
    </div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="win">
    <button class="close" id="closeBtn" type="button" data-i18n-aria="close" aria-label="بستن">×</button>
    <form id="signinForm" hidden>
      <h2 data-i18n="signin"></h2>
      <label><span data-i18n="email"></span> <input name="email" type="email" autocomplete="email"></label>
      <label><span data-i18n="password"></span> <input name="pass" type="password" autocomplete="current-password"></label>
      <button type="submit" data-i18n="login"></button>
      <p class="msg" id="signinMsg"></p>
    </form>
  </div>
</div>

<div class="wrap">
  <div class="ctls">
    <div class="ctl" style="display:none">
      <span data-i18n="rows"></span>
      <button id="delRow">−</button>
      <b id="rowN">3</b>
      <button id="addRow">+</button>
    </div>
    <div class="ctl" style="display:none">
      <span data-i18n="cols"></span>
      <button id="delCol">−</button>
      <b id="colN">12</b>
      <button id="addCol">+</button>
    </div>
  </div>
  <div class="total" id="total"></div>
  <table id="grid"></table>
  <div class="calc" id="calc"></div>

const THEMES = {
  purple: {bg:'#170c2b', card:'#241645', line:'#5a3fa0', accent:'#6d3fe0', text:'#eee6ff', muted:'#cbbcf0', res:'#ffd98a', ok:'#00e676', ink:'#4b2f8a', bgtext:'#130a28', panel:'#23143f', hover:'#342060', hdr:'#b9a6e6', badge:'#7c4dff'},
  olive: {bg:'#363e29', card:'#535e3e', line:'#60664c', accent:'#7d8f3a', text:'#f3f0df', muted:'#dce4cf', res:'#ddd4a9', ok:'#b8f08a', ink:'#60664c', bgtext:'#272d1e', panel:'#434d32', hover:'#5a6642', hdr:'#c9d3ae', badge:'#7d8f3a'}
};
let LANG = 'fa', THEME = 'purple';
const T = k => (I18N[LANG] && I18N[LANG][k]) || I18N.fa[k] || k;
function applyTheme(name){
  THEME = THEMES[name] ? name : 'purple';
  const st = document.documentElement.style;
  for (const k in THEMES[THEME]) st.setProperty('--' + k, THEMES[THEME][k]);
}
function applyLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = (LANG === 'fa') ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', T(el.dataset.i18nAria)));
  const m = document.getElementById('signupMsg'); if (m) m.textContent = '';
  const n = document.getElementById('signinMsg'); if (n) n.textContent = '';
  if (typeof renderCap === 'function') renderCap();
}
let rows = 3, cols = 12;
const MIN_ROWS = 3, MAX_ROWS = 11, MAX_COLS = 12, MIN_COLS = 12; // ردیف‌های افقی کل جدول (با ردیف جمع): ۴ تا ۱۲؛ ستون‌ها ثابت ۱۲
const gridEl = document.getElementById('grid');

const sumOf = a => a.reduce((x,y)=>x+y,0);
const digitSum = n => String(Math.abs(n)).split('').reduce((a,b)=>a+Number(b),0);
// بنفش سمت چپ: شمارهٔ خانهٔ n در ردیف اول بلوکش (از صفر)
// مضرب‌های ۱۱ از ۳۳ به بعد استثنا هستند و عدد بنفش آن‌ها ۱۱ است (۳۳=۱۱، ۴۴=۱۱، …)
const purpleLeft = n => {
  const r = n % 11;
  return (r === 0 && n >= 33) ? 11 : r;
};

// تبدیل رقم فارسی/عربی به انگلیسی و خواندن عدد؛ ورودی نامعتبر = صفر
function toNum(s){
  const t = String(s||'')
    .replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0)-0x06F0))
    .replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0)-0x0660))
    .trim();
  const n = parseFloat(t);
  return Number.isFinite(n) ? n : 0;
}

// جمع هر ستون از ماتریس (آرایهٔ ردیف‌ها)
function colSums(matrix){
  const w = Math.max(0, ...matrix.map(r=>r.length));
  const out = [];
  for(let c=0;c<w;c++){
    let t = 0;
    for(const r of matrix) t += toNum(r[c]);
    out.push(t);
  }
  return out;
}

// خواندن مقادیر فعلی خانه‌ها
function readVals(){
  return Array.from({length:rows}, (_,r) =>
    Array.from({length:cols}, (_,c) => {
      const el = gridEl.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
      return el ? el.value : '';
    }));
}

// یک ستون عمودی: بخش‌ها، خط زیر آخرین بخش، سپس نتیجه
function stk(parts, res){
  const body = parts.map((p,i)=>`<div${i===parts.length-1?' class="ln"':''}>${p}</div>`).join('');
  return `<div class="stk">${body}<div class="res">${res}</div></div>`;
}

// نمای دو ستونی (چپ = جمع کل و تفریق، راست = جمع ارقام)
function calcHtml(sums){
  const sorted = [...sums].sort((a,b)=>b-a);
  const total = sumOf(sorted);
  const small = Math.min(...sums);
  const dsSmall = digitSum(small);
  const diff = total - dsSmall;
  const dsT = digitSum(total), dsD = digitSum(diff);
  const sum2 = total + diff;
  const chain = dsT + dsD;
  const l1 = digitSum(sum2), l2 = digitSum(l1);
  const left = `<div class="side"><div class="stk"><div>${total}</div><div>${diff}</div><div class="ln">${sum2}</div><div class="res ln">${l1}</div><div class="res">${l2}</div></div></div>`;
  const mid = `<div class="mid">${dsSmall}</div>`;
  const right = `<div class="side">${stk([dsT, dsD, chain], digitSum(chain))}<span class="badge">${purpleLeft(chain)}</span></div>`;
  return `<div class="top">${mid}</div><div class="pair">${left}${right}</div>`;
}

// جمع ستون‌ها زیر هر ستون، معادلهٔ جمع مرتب، و نمای محاسبه
function updateSums(){
  const sums = colSums(readVals());
  for(let c=0;c<cols;c++){
    const el = document.getElementById('s'+c);
    if(el) el.textContent = sums[c] != null ? sums[c] : 0;
  }
  const sorted = [...sums].sort((a,b)=>b-a);
  const total = sumOf(sorted);
  document.getElementById('total').textContent =
    sorted.length ? sorted.join(' + ') + ' = ' + total : '';
  document.getElementById('calc').innerHTML = calcHtml(sums);
}

// ساخت جدول: شماره ستون‌ها بالا، ردیف‌های ورودی، ردیف جمع
function build(prev){
  let h = '<tr>';
  for(let c=0;c<cols;c++) h += `<td class="hdr">${c+1}</td>`;
  h += '</tr>';
  for(let r=0;r<rows;r++){
    h += '<tr>';
    for(let c=0;c<cols;c++){
      const v = (prev && prev[r] && prev[r][c] != null) ? prev[r][c] : '';
      h += `<td><input inputmode="decimal" value="${String(v).replace(/\"/g,'&quot;')}" data-r="${r}" data-c="${c}"></td>`;
    }
    h += '</tr>';
  }
  h += '<tr class="sum">';
  for(let c=0;c<cols;c++) h += `<td><span id="s${c}">0</span></td>`;
  h += '</tr>';
  gridEl.innerHTML = h;
  updateSums();
  setButtons();
}

function resize(dr, dc){
  const prev = readVals();
  rows = Math.min(MAX_ROWS, Math.max(1, rows + dr));
  cols = Math.min(MAX_COLS, Math.max(1, cols + dc));
  build(prev);
}

function setButtons(){
  document.getElementById('rowN').textContent = rows;
  document.getElementById('colN').textContent = cols;
  document.getElementById('addRow').disabled = rows >= MAX_ROWS;
  document.getElementById('delRow').disabled = rows <= 1;
  document.getElementById('addCol').disabled = cols >= MAX_COLS;
  document.getElementById('delCol').disabled = cols <= 1;
}

// تعداد ستون‌ها خودکار با اعداد واردشده تنظیم می‌شود:
// یک ستون خالی بعد از آخرین خانهٔ پرشده (حداقل ۲، حداکثر ۱۲)
function neededCols(vals){
  let ext = 0;
  vals.forEach(row => row.forEach((v,c) => { if(String(v).trim() !== '') ext = Math.max(ext, c+1); }));
  return Math.min(MAX_COLS, Math.max(MIN_COLS, ext + 1));
}
// تعداد ردیف‌ها از جدول ریل می‌آید (نه از تایپ). ردیف جمع همیشه آخر است.
// کل ردیف‌های افقی ۴ تا ۱۲ (یعنی ۳ تا ۱۱ ردیف ورودی + ردیف جمع)
function setRailRows(matrix){
  const src = Array.isArray(matrix) ? matrix : [];
  rows = Math.min(MAX_ROWS, Math.max(MIN_ROWS, src.length));
  const prev = Array.from({length: rows}, (_, r) => (src[r] || []).map(v => String(v)));
  build(prev);
}
// دریافت از اپ ریل: حافظهٔ مرورگر (کلید مشترک) یا پیام صفحه
const RAIL_KEY = 'formul.rail.table.v1';
function applyRailPayload(raw){
  try {
    const data = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if (data && Array.isArray(data.rows)) setRailRows(data.rows);
  } catch(_) {}
}
window.setRailRows = setRailRows;
window.addEventListener('storage', e => { if (e.key === RAIL_KEY && e.newValue) applyRailPayload(e.newValue); });
window.addEventListener('message', e => { if (e.data && e.data.channel === 'formul-rail') applyRailPayload(e.data.payload); });

gridEl.addEventListener('input', updateSums);

document.getElementById('addRow').onclick = ()=>resize(1,0);
document.getElementById('delRow').onclick = ()=>resize(-1,0);
document.getElementById('addCol').onclick = ()=>resize(0,1);
document.getElementById('delCol').onclick = ()=>resize(0,-1);

build(null);
try { const saved = localStorage.getItem(RAIL_KEY); if (saved) applyRailPayload(saved); } catch(_) {}

// ---- منو و فرم‌ها (فعلاً فقط رابط کاربری؛ اتصال به سرور وصل نیست) ----
const menuBtn = document.getElementById('menuBtn');
const menu = document.getElementById('menu');
const modal = document.getElementById('modal');
const closeBtn = document.getElementById('closeBtn');
const signupForm = document.createElement('form');
const signinForm = document.getElementById('signinForm');
let capAns = 0;
let capA = 0, capB = 0;
function renderCap(){ const q=document.getElementById("capQ"); if(q) q.textContent = capA + " + " + capB + " = ?"; }

function newCaptcha(){
  capA = 1 + Math.floor(Math.random()*9);
  capB = 1 + Math.floor(Math.random()*9);
  capAns = capA + capB;
  renderCap();
}

function openForm(which){
  menu.hidden = true;
  modal.hidden = false;
  signupForm.hidden = which !== 'signup';
  signinForm.hidden = which !== 'signin';
  signupForm.reset();
  signinForm.reset();
  document.getElementById('signinMsg').textContent = '';
  newCaptcha();
}

menuBtn.onclick = () => { menu.hidden = !menu.hidden; };
menu.querySelectorAll('button').forEach(b => b.onclick = () => openForm(b.dataset.open));
closeBtn.onclick = () => { modal.hidden = true; };
modal.addEventListener('click', e => { if(e.target === modal) modal.hidden = true; });

const BG_DEFAULT = 'thepilottmnl001';
function setBgName(n){ document.getElementById('bgName').textContent = n || BG_DEFAULT; }

signupForm.onsubmit = e => {
  e.preventDefault();
  const f = e.target;
  const fld = n => f.querySelector('[name="'+n+'"]');
  const msg = document.getElementById('signupMsg');
  const nick = fld('nick').value.trim();
  const email = fld('email').value.trim();
  const p1 = fld('pass').value, p2 = fld('pass2').value;
  let err = '';
  if (nick.length < 3 || nick.length > 30) err = T('errNick');
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) err = T('errEmail');
  else if (p1.length < 6) err = T('errPass');
  else if (p1 !== p2) err = T('errPass2');
  else if (toNum(fld('cap').value) !== capAns) err = T('errCap');
  if (err){
    msg.className = 'msg err';
    msg.textContent = err;
    newCaptcha();
    return;
  }
  msg.className = 'msg';
  msg.textContent = 'فرم درست است. ثبت‌نام روی سرور هنوز وصل نشده است.';
};
signinForm.onsubmit = e => {
  e.preventDefault();
  const msg = document.getElementById('signinMsg');
  msg.className = 'msg';
  msg.textContent = 'ورود هنوز به سرور وصل نشده است.';
};

const SOCIAL = { blog: 'https://theformul.blogfa.com/post/2', telegram: 'https://t.me/TheFormula0123', rubika: 'https://rubika.ir/MgTTRD0123' };
['blog','telegram','rubika'].forEach(k => { const a = document.getElementById('lnk'+k[0].toUpperCase()+k.slice(1)); if (SOCIAL[k]) a.href = SOCIAL[k]; });
document.getElementById('langSel').addEventListener('change', e => { LANG = e.target.value; applyLang(); });
document.getElementById('themeSel').addEventListener('change', e => applyTheme(e.target.value));
document.getElementById('langSel').value = LANG;
document.getElementById('themeSel').value = THEME;
applyTheme(THEME);
applyLang();
</script>
