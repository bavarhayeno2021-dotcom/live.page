var TOTAL=0;
ROWS.forEach(function(R){

// زیرنویس‌ها: متن کاربر، پشت سر هم، پایین صفحه
var SUB_TEXTS=[
  'خوش برگشتین امیدوار هستیم لحظات خوب و پر سود در کنار ما تجربه بکنید',
  'سعی و تلاشمون در این پلتفرم منتشر کردن جزئیات و کارت‌های پوزیشن‌های با کیفیت هست',
  'ولی این به این معنا نیست که 100% این جزئیات کامل و بی‌نقص هستند',
  'قبل از هر گونه خرید و فروش جفت‌ارزها فقط با اراده و انتخاب شخص خودتان تصمیم به فعال کردن پوزیشن‌های خود بکنید',
  'تیم thepilottmnl001 هیچ مسئولیتی در سود و ضرر هیچ کدام از کاربران را بر عهده نخواهد گرفت، چون 100% با انتخاب و اراده شخص خودتان اقدام به خرید و فروش خواهید کرد.'
];
var SUB_SPEED=110; // پیکسل در ثانیه، از چپ وارد و از راست خارج می‌شود
function wrapTwo(s){
  var w=s.split(' '); if(w.length<=4) return [s];
  var half=s.length/2, cum=0, k=0;
  for(k=0;k<w.length-1;k++){ cum+=w[k].length+1; if(cum>=half) break; }
  return [w.slice(0,k+1).join(' '), w.slice(k+1).join(' ')];
}
var SUBS=[], LINK_AT=0;
(function(){
  var t=3;
  SUB_TEXTS.forEach(function(s){
    var estW=Array.from(s).length*8.5;
    var dur=(W+estW)/SUB_SPEED;
    SUBS.push({s:t, e:t+dur, text:s});
    t+=dur+0.8;
  });
  LINK_AT=t;
})();
// زمان تایپ محتوای پوزیشن (مثل متن بالا): از ۶ ثانیه بعد از زیرنویس‌ها شروع می‌شود
var CONT_T0=LINK_AT+6, CONT_CPS=16, CONT_GAP=0.25, CONT_END=CONT_T0;
if(FILM_DATA && CONTENT_ROWS){ CONTENT_ROWS.forEach(function(R){ R.chars=Array.from(R.t); CONT_END+=R.chars.length/CONT_CPS+CONT_GAP; }); }
var NOW_MIN=(+NOW_TIME.split(':')[0])*60+(+NOW_TIME.split(':')[1]);

// هندسه
var RX=260, RY=150;
var US=0.33;
var st={t:0,playing:false,last:0,speed:10,dir:1};
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,f){return a+(b-a)*f;}
function ease(f){return f*f*(3-2*f);}
function seg(t,a,b){return clamp((t-a)/(b-a),0,1);}
function outlined(s,x,y,size,color,align,thick){
  ctx.font='bold '+size+'px '+FONT; ctx.textAlign=align; ctx.textBaseline='middle';
  ctx.lineJoin='round'; ctx.strokeStyle='rgba(0,0,0,0.9)'; ctx.lineWidth=3;
  ctx.strokeText(s,x,y);
  ctx.fillStyle=color; ctx.fillText(s,x,y);
  if(thick){ ctx.strokeStyle=color; ctx.lineWidth=1.2; ctx.strokeText(s,x,y); }
}
function txt(s,x,y,size,color,align){
  ctx.font='bold '+size+'px '+FONT; ctx.fillStyle=color;
  ctx.textAlign=align||'center'; ctx.textBaseline='middle'; ctx.fillText(s,x,y);
}
function limb(pts,w,col){
  ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
  ctx.stroke();
}
function ik(s,tg,L1,L2,maxX){
  var dx=tg.x-s.x, dy=tg.y-s.y, d0=Math.hypot(dx,dy)||0.001;
  var d=clamp(d0,Math.abs(L1-L2)+0.5,L1+L2-0.5);
  var a=Math.atan2(dy,dx);
  var c=clamp((L1*L1+d*d-L2*L2)/(2*L1*d),-1,1), ang=Math.acos(c);
  var p1={x:s.x+L1*Math.cos(a+ang),y:s.y+L1*Math.sin(a+ang)};
  var p2={x:s.x+L1*Math.cos(a-ang),y:s.y+L1*Math.sin(a-ang)};
  var j=(maxX?(p1.x>p2.x):(p1.x<p2.x))?p1:p2;
  var k=Math.min(d0,L1+L2-0.5)/d0;
  return {j:j,e:{x:s.x+dx*k,y:s.y+dy*k}};
}
function X(u){ var x=-40+u*920; return st.dir>0?x:(W-x); }
function worldX(t){ return X(lerp(0,US,ease(seg(t,0,100)))); }
function laneY(t){ return lerp(G,FAR,ease(seg(t,50,54))); }
function facing(t){ return st.dir; }
function isWalking(t){ return t<100; }
var FP=[];
function buildFP(){
  FP=[];
  for(var ft=0;ft<=100;ft+=0.4){ if(isWalking(ft)) FP.push({x:worldX(ft),y:laneY(ft)+7,t:ft}); }
}

// آدمک (کف = ۰)، دست‌ها همیشه صاف
function drawMan(m){
  var bob=m.walk?Math.abs(Math.sin(m.ph*2))*1.5:0;
  var hip={x:0,y:-98-bob};
  var sh={x:0,y:hip.y-72};
  var head={x:m.look*2,y:sh.y-22};
  var fL={x:(m.walk?Math.sin(m.ph)*24:-8), y:-(m.walk?Math.max(0,Math.cos(m.ph))*10:0)};
  var fR={x:(m.walk?Math.sin(m.ph+Math.PI)*24:8), y:-(m.walk?Math.max(0,Math.cos(m.ph+Math.PI))*10:0)};
  var kL=ik(hip,fL,46,46,true), kR=ik(hip,fR,46,46,true);
  limb([hip,kR.j,kR.e],17,'#cbd5e1');
  limb([hip,kL.j,kL.e],17,'#e2e8f0');
  ctx.fillStyle='#475569';
  ctx.fillRect(kR.e.x-6,kR.e.y-6,26,10); ctx.fillRect(kL.e.x-6,kL.e.y-6,26,10);
  ctx.fillStyle='#94a3b8'; ctx.fillRect(sh.x-40,sh.y+2,12,46);
  ctx.fillStyle='#e2e8f0';
  ctx.beginPath();
  ctx.moveTo(sh.x-30,sh.y+2); ctx.lineTo(sh.x+30,sh.y+2);
  ctx.lineTo(hip.x+18,hip.y+4); ctx.lineTo(hip.x-18,hip.y+4);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(sh.x-28,sh.y+6,11,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sh.x+28,sh.y+6,11,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#94a3b8'; ctx.fillRect(sh.x-1,sh.y+8,2,38);
  ctx.fillStyle='#22c55e'; ctx.fillRect(sh.x-9,sh.y+16,6,4);
  limb([sh,{x:head.x,y:head.y+8}],10,'#cbd5e1');
  ctx.fillStyle='#f8fafc'; ctx.beginPath(); ctx.arc(head.x,head.y,18,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#0c4a6e';
  ctx.beginPath(); ctx.ellipse(head.x+4,head.y-1,11,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#38bdf8'; ctx.fillRect(head.x+1,head.y-5,4,2);
  var LS={x:sh.x-26,y:sh.y+6}, RS={x:sh.x+26,y:sh.y+6};
  var lAng=Math.PI/2+(m.walk?Math.sin(m.ph)*0.12:0);
  var lEnd={x:LS.x+Math.cos(lAng)*65, y:LS.y+Math.sin(lAng)*65};
  var kLa=ik(LS,lEnd,34,32,false);
  limb([LS,kLa.j,kLa.e],15,'#e2e8f0');
  ctx.fillStyle='#cbd5e1'; ctx.beginPath(); ctx.arc(kLa.e.x,kLa.e.y,7,0,Math.PI*2); ctx.fill();
  var rEnd={x:RS.x+Math.cos(m.rAng)*65, y:RS.y+Math.sin(m.rAng)*65};
  var kRa=ik(RS,rEnd,34,32,false);
  limb([RS,kRa.j,kRa.e],15,'#e2e8f0');
  var hx=kRa.e.x, hy=kRa.e.y, a=m.rAng;
  var cx=hx+Math.cos(a)*26, cy=hy+Math.sin(a)*26;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(a);
  ctx.fillStyle='#334155'; ctx.fillRect(-6,4,14,22);
  ctx.fillStyle='#9ca3af'; ctx.fillRect(-36,-9,70,18);
  ctx.fillStyle='#6b7280'; ctx.fillRect(-30,-5,22,10);
  ctx.fillStyle='#334155'; ctx.fillRect(10,-9,16,5);
  if(m.led){
    ctx.shadowColor=m.led; ctx.shadowBlur=16; ctx.fillStyle=m.led;
    ctx.beginPath(); ctx.arc(38,0,5,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  }
  ctx.restore();
  ctx.fillStyle='#cbd5e1'; ctx.beginPath(); ctx.arc(hx,hy,7,0,Math.PI*2); ctx.fill();
  return {tip:{x:cx+Math.cos(a)*38,y:cy+Math.sin(a)*38}};
}

// پس‌زمینه: آسمان، ماه، کوه
function ridge(base,amp,col,seed){
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,FAR);
  for(var x=0;x<=W;x+=8){
    var y=base-amp*(40*Math.abs(Math.sin(x*0.009+seed))+18*Math.abs(Math.sin(x*0.023+seed*2))+6*Math.sin(x*0.07+seed));
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,FAR); ctx.closePath(); ctx.fill();
}
function drawBackground(){
  var sky=ctx.createLinearGradient(0,0,0,FAR);
  sky.addColorStop(0,'#03050c'); sky.addColorStop(1,'#1a2a47');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,FAR);
  ctx.fillStyle='rgba(226,232,240,0.55)';
  for(var i=0;i<45;i++){ ctx.fillRect((i*197+31)%W,(i*71)%190,2,2); }
  var mg=ctx.createRadialGradient(800,78,20,800,78,120);
  mg.addColorStop(0,'rgba(254,249,195,0.38)'); mg.addColorStop(1,'rgba(254,249,195,0)');
  ctx.fillStyle=mg; ctx.fillRect(660,0,280,230);
  ctx.fillStyle='#f1f5d0'; ctx.beginPath(); ctx.arc(800,78,34,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(120,120,95,0.35)';
  ctx.beginPath(); ctx.arc(790,70,7,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(812,90,5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(805,62,3,0,Math.PI*2); ctx.fill();
  ridge(330,1.0,'#24355a',1.3);
  ridge(360,1.25,'#15213a',2.4);
  // دیوار (شفاف، کوه‌ها پشتش دیده می‌شوند)
  ctx.fillStyle='rgba(8,14,28,0.55)'; ctx.fillRect(0,120,W,FAR-120);
  ctx.strokeStyle='rgba(56,189,248,0.08)'; ctx.lineWidth=1;
  for(var gx=0;gx<W;gx+=60){ ctx.beginPath(); ctx.moveTo(gx,120); ctx.lineTo(gx,FAR); ctx.stroke(); }
  // نام، هک شده روی دیوار و هم‌رنگ دیوار
  ctx.font='bold 46px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(40,60,96,0.35)'; ctx.fillText(BRAND,W/2+1,201);
  ctx.fillStyle='rgba(6,11,22,0.92)'; ctx.fillText(BRAND,W/2,200);
  // زمین خاکی
  var fl=ctx.createLinearGradient(0,FAR,0,H);
  fl.addColorStop(0,'#3d3227'); fl.addColorStop(1,'#1b1510');
  ctx.fillStyle=fl; ctx.fillRect(0,FAR,W,H-FAR);
  for(var di=0;di<90;di++){
    var dx=(di*131+17)%W, dy=FAR+8+((di*59)%(H-FAR-10));
    ctx.fillStyle=(di%2)?'rgba(130,104,74,0.35)':'rgba(24,18,12,0.5)';
    ctx.fillRect(dx,dy,1+(di%3),1+(di%2));
  }
  for(var ri=0;ri<14;ri++){
    var rx=(ri*211+40)%W, ry=FAR+30+((ri*97)%(H-FAR-40)), rw=6+(ri%4)*3;
    ctx.fillStyle='#2a2219'; ctx.beginPath(); ctx.ellipse(rx,ry,rw,rw*0.45,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(150,120,90,0.35)'; ctx.beginPath(); ctx.ellipse(rx-1,ry-2,rw*0.5,rw*0.2,0,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle='#2b3a52'; ctx.fillRect(0,FAR,W,2);
  ctx.fillStyle='#4a3d2e'; ctx.fillRect(0,G,W,2);
}

// صدا: موسیقی ملایم و صدای کلید تایپ، هر دو با کد خودمان ساخته می‌شوند (بدون فایل کپی‌رایتی)
// ===== ضبط ویدیو: هر بار پخش از اول، فیلم (تصویر + صدا) ضبط و آخر فیلم قابل دانلود می‌شود =====
var REC={mr:null, chunks:[], url:null, mime:'', ext:'webm'};
var recDest=null;
function recSetMsg(m){ var e=document.getElementById('rec'); if(e) e.textContent=m; }
function recPickMime(){
  var c=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  for(var i=0;i<c.length;i++){ if(MediaRecorder.isTypeSupported(c[i])) return c[i]; }
  return '';
}
function recClock(s){ var m=Math.floor(s/60), r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
function recStart(){
  if(REC.mr) return;
  if(typeof MediaRecorder==='undefined'||!cv.captureStream){ recSetMsg('ضبط در این مرورگر پشتیبانی نمی‌شود. از کروم یا سامسونگ اینترنت استفاده کنید'); return; }
  var tracks=[];
  try{ tracks=cv.captureStream(30).getVideoTracks(); }catch(e){ recSetMsg('ضبط تصویر شروع نشد: '+e.message); return; }
  if(recDest) tracks=tracks.concat(recDest.stream.getAudioTracks());
  var mime=recPickMime();
  var mr;
  try{ mr=new MediaRecorder(new MediaStream(tracks), mime?{mimeType:mime,videoBitsPerSecond:3000000}:{videoBitsPerSecond:3000000}); }
  catch(e){ recSetMsg('ضبط شروع نشد: '+e.message); return; }
  REC.chunks=[]; REC.mime=mr.mimeType||mime||'video/webm';
  mr.ondataavailable=function(e){ if(e.data&&e.data.size) REC.chunks.push(e.data); };
  mr.onstop=recFinish;
  mr.onerror=function(e){ recSetMsg('خطای ضبط: '+((e&&e.error&&e.error.name)||'نامشخص')); };
  mr.start(1000);
  REC.mr=mr; REC.t0=Date.now();
  st.speed=1; speedSel.value='1'; speedSel.disabled=true;   // ضبط همیشه در سرعت واقعی
  document.getElementById('dl').style.display='none';
  clearInterval(REC.timer);
  REC.timer=setInterval(function(){ if(REC.mr) recSetMsg('● در حال ضبط '+recClock(Math.floor((Date.now()-REC.t0)/1000))+' — تب را باز و روشن نگه دارید'); },500);
  recSetMsg('● در حال ضبط '+recClock(0));
}
function recFinish(){
  clearInterval(REC.timer);
  var type=(REC.mime||'video/webm').split(';')[0];
  REC.ext=(type.indexOf('mp4')>=0)?'mp4':'webm';
  var blob=new Blob(REC.chunks,{type:type});
  if(REC.url) URL.revokeObjectURL(REC.url);
  REC.url=URL.createObjectURL(blob);
  REC.mr=null; speedSel.disabled=false;
  var a=document.getElementById('dl');
  a.href=REC.url; a.download='film1-'+Date.now()+'.'+REC.ext; a.style.display='inline-block';
  recSetMsg('ضبط تمام شد ('+(blob.size/1048576).toFixed(1)+' مگابایت). اگر دانلود خودکار شروع نشد، دکمهٔ «⬇ دانلود ویدیو» را بزنید');
  try{ a.click(); }catch(e){}
}
function recStop(){ if(REC.mr && REC.mr.state!=='inactive') REC.mr.stop(); }
var AC=window.AudioContext||window.webkitAudioContext, actx=null, master=null, clickBuf=null;
function audioInit(){
  if(!AC||actx) return;
  actx=new AC();
  master=actx.createGain(); master.gain.value=0.9; master.connect(actx.destination);
  try{ recDest=actx.createMediaStreamDestination(); master.connect(recDest); }catch(e){ recDest=null; }
  var len=Math.floor(actx.sampleRate*0.02);
  clickBuf=actx.createBuffer(1,len,actx.sampleRate);
  var d=clickBuf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(actx.sampleRate*0.004));
}
function clickSound(){
  if(!actx||!clickBuf) return;
  var src=actx.createBufferSource(); src.buffer=clickBuf;
  var g=actx.createGain(); g.gain.value=0.25;
  src.connect(g); g.connect(master); src.start();
}

function scene(t){
  drawBackground();

  for(var i=0;i<FP.length;i++){
    var f=FP[i]; if(f.t>t) break;
    ctx.fillStyle='rgba(15,23,42,0.7)';
    ctx.beginPath(); ctx.ellipse(f.x+(i%2?-7:7),f.y,6,3,0,0,Math.PI*2); ctx.fill();
  }

  var mx=worldX(t), ly=laneY(t), fc=facing(t), walk=isWalking(t);
  var FADE=1;   // متن‌ها تا آخر روی صفحه می‌مانند
  // بعد از تمام شدن کل متن: نور از بالا، آدمک زیر نور می‌رود، سریع بالا می‌رود و از سقف تصویر خارج می‌شود
  var BT=CONT_END+1.0;      // لحظهٔ روشن شدن نور
  var RT=BT+2.0;            // لحظهٔ شروع پرواز به بالا
  var mx0=worldX(100), BX=mx0+30*fc;   // محل نور روی زمین
  var lean=0;
  if(t>=BT+0.3){ mx=lerp(mx0,BX,ease(seg(t,BT+0.3,BT+1.8))); walk=(t<BT+1.8); }
  if(t>=RT){ var rp=seg(t,RT,RT+1.4); ly=FAR-760*rp*rp; mx=BX; walk=false; }
  var SCANS=SCAN_ITEMS||[{t:'نقطهٔ شروع 🚩 20:00 27oct'},{t:'تایم اول ⏱ 21'},{t:'تایم دوم ⏱ 10'},{t:'کندل اول 🕯 6'},{t:'کندل دوم 🕯 6'}];
  var SCANT=[3,15,27,39,51,63];   // هر ۱۲ ثانیه یک مورد، از لحظهٔ ورود آدمک
  var blink=false;
  SCANT.forEach(function(s0){ if(t>=s0 && t<s0+1.2 && Math.floor((t-s0)*8)%2===0) blink=true; });
  var m={walk:walk, ph:t*5, look: walk?0:Math.sin(t*1.3)*0.6, rAng:0.55, led:blink?'#22c55e':null};
  if(t>=100) m.look=1;
  if(t>=100 && t<107){ m.rAng=lerp(0.55,-0.15,ease(seg(t,100,107))); }
  if(t>=107){ m.rAng=-0.15; }
  if(t>=RT-0.4){ m.rAng=lerp(-0.15,1.3,ease(seg(t,RT-0.4,RT))); }   // دست به سمت بالا هنگام پرواز

  ctx.save();
  ctx.translate(mx,ly); ctx.scale(fc,1); ctx.rotate(0.35*lean);
  var tipLocal=drawMan(m).tip;
  ctx.restore();
  var tip={x:mx+fc*tipLocal.x, y:ly+tipLocal.y};

  // نام آدمک روی سینه‌اش
  txt('thepilot', mx, ly-131, 12, '#e2e8f0', 'center');
  // ساعت نیویورک روی سینهٔ آدمک، همراه با زمان فیلم (وقتی پلی می‌شود، می‌چرخد)
  var nyTot=(NOW_MIN*60+Math.floor(t))%86400;
  var nyT=pad2(Math.floor(nyTot/3600))+':'+pad2(Math.floor(nyTot/60)%60)+':'+pad2(nyTot%60);
  outlined('NY '+nyT, mx, ly-148, 13, '#fde68a', 'center', false);
  // نور سفینه‌ای از بالا: روی زمین پهن می‌شود و آدمک زیر آن می‌رود
  var bAlpha=clamp((t-BT)/0.6,0,1)*(1-clamp((t-(RT+0.6))/0.8,0,1));
  if(bAlpha>0){
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=bAlpha*0.5;
    var bgr=ctx.createLinearGradient(0,0,0,FAR+14);
    bgr.addColorStop(0,'rgba(224,242,254,0.10)'); bgr.addColorStop(1,'rgba(224,242,254,0.55)');
    ctx.fillStyle=bgr; ctx.beginPath(); ctx.moveTo(BX-6,0); ctx.lineTo(BX+6,0); ctx.lineTo(BX+80,FAR+14); ctx.lineTo(BX-80,FAR+14); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(224,242,254,0.9)'; ctx.beginPath(); ctx.ellipse(BX,FAR+14,95,16,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // نام THEPILOTTMNL001 در هوا، بالای سر آدمک، کمی تار
  ctx.save(); ctx.filter='blur(1.2px)'; ctx.globalAlpha=0.55;
  txt(VIEWER_PARAM||'THEPILOTTMNL001', mx, ly-238, 17, '#e2e8f0', 'center');
  ctx.restore();

  // حلقهٔ چشمک‌زن زیر پا، در هر بار اسکن
  SCANT.forEach(function(s0){
    var d=t-s0;
    if(d<0||d>=1.2) return;
    ctx.save(); ctx.globalAlpha=1-d/1.2; ctx.strokeStyle='#22c55e'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(mx,ly+3,20+d*50,(20+d*50)*0.3,0,0,Math.PI*2); ctx.stroke(); ctx.restore();
  });

  // اسکنر: موارد یکی‌یکی بالا می‌آیند و در گوشهٔ بالا سمت چپ می‌مانند
  var SX=40, SY0=34, SPITCH=28;
  if(t>=SCANT[0]){
    SCANS.forEach(function(S,i){
      var s0=SCANT[i]; if(t<s0) return;
      var y=lerp(SY0+i*SPITCH+26, SY0+i*SPITCH, ease(seg(t,s0,s0+0.6)));
      ctx.save(); ctx.globalAlpha=clamp((t-s0)/0.3,0,1)*FADE;
      ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(SX,y-13,220,26);
      ctx.strokeStyle='#22d3ee'; ctx.lineWidth=2; ctx.strokeRect(SX,y-13,220,26);
      txt('✔ '+S.t, SX+110, y, 14, '#67e8f9', 'center');
      ctx.restore();
    });
  }

  var CT0=5;
  // سلام: بالای صفحه
  var T1=[{t:'سلام', s:CT0, y:30}, {t:'خدمت شما عزیزان ....', s:CT0+3, y:56}];
  ctx.save(); ctx.globalAlpha=FADE;
  T1.forEach(function(C){
    if(t<C.s) return;
    var n=Math.floor((t-C.s)*12);
    txt(Array.from(C.t).slice(0,n).join(''), 620, C.y, 20, '#f5ecd6', 'center');
  });
  ctx.restore();
  // تایپ یک بلوک چندخطی، کاراکتر به کاراکتر، بدون صدای کلید
  function typeBlock(lines,t0,cps,x,y0,pitch,size,color,align,pauses){
    pauses=pauses||[];
    ctx.save(); ctx.globalAlpha=FADE;
    var acc=t0;
    lines.forEach(function(L,i){
      acc+=(pauses[i]||0);
      var len=Array.from(L).length;
      var n=Math.floor(clamp((t-acc)*cps,0,len));
      acc+=len/cps;
      if(n<=0) return;
      outlined(Array.from(L).slice(0,n).join(''), x, y0+i*pitch, size, color, align, false);
    });
    ctx.restore();
  }
  // شرح: thepilot در حال شناسایی مقدمات قبل ورود به پوزیشن
  var NAR=[
    'thepilot در حال شناسایی مقدمات قبل ورود به پوزیشن است',
    NAR_L1,
    'را انجام می‌دهد؛',
    'تلاش می‌کند یک پوزیشن دقیق و با کیفیت را مهیا کند.',
    '', '', '', '', '',
    'البته این شماره ارتفاع برای ما حائز اهمیت است.'
  ];
  typeBlock(NAR, 56, 16, 930, 82, 28, 18, '#f5ecd6', 'right', [0,0,0,0,6]);
  // محتوای آخر پوزیشن، بعد از شرح (مثل متن بالا، حرف به حرف تایپ می‌شود)
  var FIN=[
    'نقطهٔ شروع   📆 20:00 27oct 🚩',
    'تایم اول ⏱ 3=21',
    'تایم دوم ⏱10=10',
    'کندل اول 🕯 6🎯',
    'کندل دوم 🕯 6🏁'
  ];
  if(!FILM_DATA) typeBlock(FIN, 100, 14, 930, 380, 27, 19, '#fde68a', 'right');
  if(FILM_DATA && CONTENT_ROWS){
    var CY0=82+9*28+28;   // درست زیر جملهٔ «البته»
    var acc=CONT_T0;
    CONTENT_ROWS.forEach(function(R,i){
      var len=R.chars.length;
      var n=Math.floor(clamp((t-acc)*CONT_CPS,0,len));
      acc+=len/CONT_CPS+CONT_GAP;
      if(n<=0) return;
      outlined(R.chars.slice(0,n).join(''), 930, CY0+i*15, 14, R.c, 'right', false);

  }

  // زیرنویس‌ها: یک خط که از سمت چپ وارد و از سمت راست خارج می‌شود
  SUBS.forEach(function(S){
    if(t<S.s||t>S.e) return;
    ctx.font='bold 16px '+FONT;
    var w=ctx.measureText(S.text).width;
    var p=(t-S.s)/(S.e-S.s);
    var x=lerp(-w,W,p);
    ctx.save();
    outlined(S.text, x, H-20, 16, '#fef3c7', 'left', false);
    ctx.restore();
  });

  // لینک: بعد از پایان زیرنویس‌ها، ثابت تا آخر فیلم
  if(t>=LINK_AT){
    var la=clamp((t-LINK_AT)/0.5,0,1);
    ctx.save(); ctx.globalAlpha=la;
    outlined(LINK, W/2, H-20, 18, '#f5ecd6', 'center', true);
    ctx.restore();
  }

  // نام در بالا سمت راست
  txt(VIEWER_PARAM||'thepilottmnl', W-16, 22, 16, '#e2e8f0', 'right');

var bgmEl=document.getElementById('bgm'), bgmNode=null, bgmGain=null;
var DAY_MUSIC=['07_Sunday.mp3','01_Monday.mp3','02_Tuesday.mp3','03_Wednesday.mp3','04_Thursday.mp3','05_Friday.mp3','06_Saturday.mp3'];
function bgmPickSrc(){
  var s=(typeof FILM_DATA!=='undefined'&&FILM_DATA&&FILM_DATA.entry&&FILM_DATA.entry.time)||'';
  var m=String(s).match(/(\d{4})-(\d{2})-(\d{2})/); var f='calm.mp3';
  if(m){ var d=new Date(+m[1],+m[2]-1,+m[3]); f=DAY_MUSIC[d.getDay()]; }
  if(bgmEl) bgmEl.src=f;
}
bgmPickSrc();
function bgmGainFor(){ return (st.speed===1)?0.45:0; }
function bgmSetup(){
  if(bgmNode||!actx||!bgmEl) return;
  try{
    bgmNode=actx.createMediaElementSource(bgmEl);
    bgmGain=actx.createGain(); bgmGain.gain.value=bgmGainFor();
    bgmNode.connect(bgmGain); bgmGain.connect(master);
  }catch(e){ bgmNode=null; }
}
function bgmUpdate(){ if(bgmGain&&actx) bgmGain.gain.setTargetAtTime(bgmGainFor(), actx.currentTime, 0.05); }
function bgmStart(){
  bgmSetup(); bgmUpdate();
  if(bgmEl) bgmEl.play().catch(function(){});
}

var lastTi=-1;

window.__api={scene:scene, setDir:function(d){st.dir=d; buildFP();}, get TOTAL(){return TOTAL;}, DUR:DUR, TYPE_START:TYPE_START, CPS:CPS};
var playBtn=document.getElementById('play'), pauseBtn=document.getElementById('pause'), resetBtn=document.getElementById('reset'), speedSel=document.getElementById('speed');
playBtn.onclick=function(){
  if(st.t>=DUR) st.t=0;
  if(st.t===0){ buildFP(); lastTi=-1; }
  st.playing=true;
  try{ if(!actx) audioInit(); else if(actx.state==='suspended') actx.resume(); }catch(e){ recSetMsg('صدا: '+e.message); }
  if(REC.mr && REC.mr.state==='paused') REC.mr.resume();
  else if(!REC.mr) recStart();
  bgmStart();
};
pauseBtn.onclick=function(){ bgmEl.pause(); st.playing=false; if(actx&&actx.state==='running') actx.suspend(); if(REC.mr&&REC.mr.state==='recording') REC.mr.pause(); };
resetBtn.onclick=function(){ bgmEl.pause(); bgmEl.currentTime=0; st.t=0; st.playing=false; lastTi=-1; if(actx&&actx.state==='running') actx.suspend(); recStop(); };
speedSel.onchange=function(){ st.speed=+this.value; bgmUpdate(); };
recSetMsg('نسخهٔ ضبط ۳ — با «▶ پخش» ضبط خودکار شروع می‌شود؛ آخر فیلم فایل دانلود می‌شود');
buildFP();
function frame(now){
  var dt=st.last?Math.min(0.1,(now-st.last)/1000):0; st.last=now;
  if(st.playing){ st.t+=dt*st.speed; if(st.t>=DUR){ st.t=DUR; st.playing=false; recStop(); bgmEl.pause(); } }
  ctx.setTransform(1,0,0,1,0,0);
  if(!window.__manual) scene(st.t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
